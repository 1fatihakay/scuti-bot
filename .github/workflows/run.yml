name: Sofascore Bot

on:
  schedule:
    - cron: '*/5 * * * *' # Her 5 dakikada bir otomatik çalışır
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install curl_cffi requests

      - name: Botu Çalıştır
        run: |
          python3 app.py
